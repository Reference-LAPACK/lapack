# Python tooling configuration for the repository's Python scripts
# (lapack_testing.py and the CI helpers under .github/scripts). This file
# intentionally has no [project]/[build-system] tables: the repository is
# not a Python package.

[tool.black]
target-version = ["py37"]

[tool.ty.environment]
python-version = "3.7"

[tool.ty.src]
include = ["lapack_testing.py", ".github/scripts/memcheck_junit.py"]

[tool.basedpyright]
pythonVersion = "3.7"
typeCheckingMode = "strict"
include = ["lapack_testing.py", ".github/scripts/memcheck_junit.py"]

[tool.pydocstyle]
convention = "google"

[tool.interrogate]
fail-under = 100
verbose = 1
